<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Low contrast text</title>
    <style>
      .faint { color: #aaaaaa; background-color: #ffffff; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Low contrast text</h1>
      <p class="faint">This sentence is too faint to read comfortably.</p>
    </main>
  </body>
</html>
