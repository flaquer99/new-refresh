<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Small targets on mobile</title>
    <style>
      .toolbar { display: flex; gap: 16px; }
      .toolbar button { width: 44px; height: 44px; padding: 0; }
      @media (max-width: 400px) {
        .toolbar { gap: 0; }
        .toolbar button { width: 12px; height: 12px; font-size: 8px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Small targets on mobile</h1>
      <div class="toolbar">
        <button type="button">B</button><button type="button">I</button><button type="button">U</button>
      </div>
    </main>
  </body>
</html>
